[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d402"
version = "0.1.0"
description = "Minimal d402 agent client: earn API vouchers by labelling data, spend them with a requests wrapper"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["cryptography>=41", "requests>=2.28"]

[project.scripts]
d402 = "d402.cli:main"

[tool.setuptools]
packages = ["d402"]
